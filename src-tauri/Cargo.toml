[package]
name = "notecal"
version = "0.1.0"
description = "Calculator notepad: natural math per line, results as you type"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
notecal-core = { path = "../crates/notecal-core" }
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-full = "0.7.0"
toml = "1.2.0"

[lints]
workspace = true
