[package]
name = "notecal"
version = "0.1.0"
description = "Calculator notepad: natural math per line, results as you type"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
notecal-core = { path = "../crates/notecal-core" }
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-full = "0.7.0"
toml = "1.2.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-global-shortcut = "2.4.1"
ureq = { version = "3.5.1", features = ["json"] }

[lints]
workspace = true
