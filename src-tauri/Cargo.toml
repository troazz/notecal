[package]
name = "notecal"
version = "0.1.0"
description = "Calculator notepad: natural math per line, results as you type"
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
notecal-core = { path = "../crates/notecal-core" }
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
