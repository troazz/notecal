name: Release

# A `v*` tag builds the macOS .dmg, the Windows installer and the Linux
# AppImage and attaches them to a draft GitHub Release for review (PRD M5,
# M10). The macOS and Windows bundles also carry notecal-cli. The AUR package builds from the
# tagged source instead (packaging/aur/PKGBUILD).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin --bundles dmg --config src-tauri/tauri.release.conf.json
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles nsis --config src-tauri/tauri.release.conf.json
            rust-targets: ""
          # Older glibc so the AppImage runs on more distributions. An AppImage
          # can't expose a second program, so it has no notecal-cli.
          - platform: ubuntu-22.04
            args: --bundles appimage
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev build-essential

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2

      - name: Install UI dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      # Tauri bundles `binaries/notecal-cli-<target>` (tauri.release.conf.json).
      - name: Build notecal-cli for the bundle
        if: runner.os != 'Linux'
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          if [ "$RUNNER_OS" = macOS ]; then
            cargo build --release -p notecal-cli --target aarch64-apple-darwin
            cargo build --release -p notecal-cli --target x86_64-apple-darwin
            lipo -create -output src-tauri/binaries/notecal-cli-universal-apple-darwin \
              target/aarch64-apple-darwin/release/notecal-cli \
              target/x86_64-apple-darwin/release/notecal-cli
          else
            cargo build --release -p notecal-cli
            cp target/release/notecal-cli.exe src-tauri/binaries/notecal-cli-x86_64-pc-windows-msvc.exe
          fi

      - name: Build and attach to a draft release
        id: tauri
        uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # src-tauri/ is at the repo root; the CLI is installed under ui/.
          tauriScript: ui/node_modules/.bin/tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: notecal ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md. The macOS and Windows builds are unsigned; on macOS allow it once in System Settings › Privacy & Security › Open Anyway, on Windows choose More info › Run anyway.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # PRD package-size budget: .dmg ≤ 15 MB; the AppImage bundles WebKitGTK
      # and the Windows installer may carry the WebView2 bootstrapper, so their
      # sizes are reported, not budgeted.
      - name: Check bundle sizes
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          status=0
          while IFS= read -r path; do
            [ -f "$path" ] || continue
            # GNU stat first: on Linux `stat -f` means filesystem status.
            size=$(stat -c%s "$path" 2>/dev/null || stat -f%z "$path")
            mb=$(awk -v s="$size" 'BEGIN { printf "%.1f", s / 1048576 }')
            echo "$(basename "$path"): ${mb} MB"
            echo "- $(basename "$path"): ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
            case "$path" in
              *.dmg)
                if [ "$size" -gt $((15 * 1024 * 1024)) ]; then
                  echo "::error::$(basename "$path") is ${mb} MB, over the 15 MB budget"
                  status=1
                fi ;;
            esac
          done < <(echo "$ARTIFACTS" | jq -r '.[]')
          exit $status
