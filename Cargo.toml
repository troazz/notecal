[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/troazz/notecal"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Smaller, faster release binary (PRD package-size budget). `panic` stays
# `unwind`: the engine catches a panic per line instead of crashing.
[profile.release]
strip = true
lto = "fat"
codegen-units = 1
