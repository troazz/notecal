<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- notecal icon: a note page with calculation lines and right-aligned results -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3045"/>
      <stop offset="1" stop-color="#171a26"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <rect x="232" y="184" width="560" height="656" rx="56" fill="#f4f1ea"/>
  <!-- expression lines (left) -->
  <rect x="300" y="282" width="220" height="40" rx="20" fill="#3b4260"/>
  <rect x="300" y="390" width="170" height="40" rx="20" fill="#3b4260"/>
  <rect x="300" y="498" width="250" height="40" rx="20" fill="#3b4260"/>
  <!-- results (right, muted) -->
  <rect x="604" y="282" width="120" height="40" rx="20" fill="#9aa1b8"/>
  <rect x="624" y="390" width="100" height="40" rx="20" fill="#9aa1b8"/>
  <rect x="584" y="498" width="140" height="40" rx="20" fill="#9aa1b8"/>
  <!-- total: an equals sign and the highlighted result -->
  <rect x="300" y="628" width="76" height="22" rx="11" fill="#e8a33d"/>
  <rect x="300" y="672" width="76" height="22" rx="11" fill="#e8a33d"/>
  <rect x="548" y="626" width="176" height="70" rx="35" fill="#e8a33d"/>
</svg>
